name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: yaml
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint PHP files
        run: |
          php -l yaml-polyfill.php
          php -l unit_tests.php

      - name: Tests without PECL yaml (php -n ignores php.ini)
        env:
          NO_COLOR: 1
        run: php -n unit_tests.php

      - name: Tests with PECL yaml loaded
        env:
          NO_COLOR: 1
        run: |
          php -m | grep -qx yaml
          php unit_tests.php
